{{- if .Values.hooks }}
{{- range $i, $hook := list (dict "name" "orders-post-install" "hook" "post-install") (dict "name" "orders-pre-upgrade" "hook" "pre-upgrade") }}
{{ if $i }}---
{{ end }}apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hook.name }}
  labels:
    app.kubernetes.io/name: orders
  annotations:
    "helm.sh/hook": {{ $hook.hook }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-hook
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders
          image: "{{ $.Values.image.repository }}@{{ $.Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: JOB_SLEEP
              value: {{ $.Values.hookSleep | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
{{- end }}
