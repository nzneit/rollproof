{{- if eq .Values.workload "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: orders
  labels:
    app.kubernetes.io/name: orders
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      {{- include "orders.podSpec" . | nindent 6 }}
{{- end }}
