{{- if eq .Values.workload "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders
  labels:
    app.kubernetes.io/name: orders
spec:
  serviceName: orders
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      {{- include "orders.podSpec" . | nindent 6 }}
{{- end }}
