# The action's own test, its second run: the candidate with no readiness probe, which fails in its
# deploy (design, section 12, "The action"). The job builds the two images as the suite's harness
# does.
version: 1
images:
  previous: { local: "rollproof-fixture:previous" }
  candidate: { local: "rollproof-fixture:candidate" }
deploy:
  namespace: orders
  helm:
    release: orders
    previous:
      chart: ../../../fixtures/chart
      values:
        - image: { repository: "${images.previous.repository}", digest: "${images.previous.digest}" }
    candidate:
      chart: ../../../fixtures/chart
      values:
        - image: { repository: "${images.candidate.repository}", digest: "${images.candidate.digest}" }
        - { readiness: false, startDelay: "5s" }
probe:
  http: { url: "http://orders.orders.svc/work?ms=20" }
