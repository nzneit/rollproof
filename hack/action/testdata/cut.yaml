# The action's own test, its third run: the first fixture with a steady window far longer than the
# step's time limit of 2 minutes, which ends it before the verdict (design, section 12, "The
# action"). The job builds the two images as the suite's harness does.
version: 1
images:
  previous: { local: "rollproof-fixture:previous" }
  candidate: { local: "rollproof-fixture:candidate" }
deploy:
  namespace: orders
  helm:
    release: orders
    previous:
      chart: ../../../fixtures/chart
      values:
        - image: { repository: "${images.previous.repository}", digest: "${images.previous.digest}" }
    candidate:
      chart: ../../../fixtures/chart
      values:
        - image: { repository: "${images.candidate.repository}", digest: "${images.candidate.digest}" }
probe:
  http: { url: "http://orders.orders.svc/work?ms=20" }
limits:
  steady: 10m
