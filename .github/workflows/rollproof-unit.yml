name: rollproof unit tests

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Vet the code under each build tag
        run: |
          go vet -tags cluster ./...
          go vet -tags e2e ./...
          go vet -tags mirror ./...
      - name: Unit tests
        run: go test ./...
      - name: Build
        run: env CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=dev" -o bin/rollproof ./cmd/rollproof
      - name: The binary is statically linked
        run: |
          file bin/rollproof
          file bin/rollproof | grep -q "statically linked"
      - name: Build for arm64
        run: env CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=dev" -o bin/rollproof-arm64 ./cmd/rollproof
      - name: The arm64 binary is statically linked
        run: |
          file bin/rollproof-arm64
          file bin/rollproof-arm64 | grep -q "ARM aarch64"
          file bin/rollproof-arm64 | grep -q "statically linked"
