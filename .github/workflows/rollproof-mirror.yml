name: rollproof mirror job

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: projects/rollproof

jobs:
  mirror:
    runs-on: ubuntu-24.04
    # Longer than go test's -timeout 60m below plus the steps before it, so that a hung test ends
    # by its own limit, with its goroutine dump and its cleanups, before GitHub cancels the job.
    timeout-minutes: 75
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: projects/rollproof/go.sum
      - name: Helm and kubectl
        run: go run ./hack/fetchhelm
      - name: The mirror job
        run: go test -tags mirror -p 1 ./e2e/ -run TestMirror -v -timeout 60m
